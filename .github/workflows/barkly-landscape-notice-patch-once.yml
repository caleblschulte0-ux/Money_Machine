name: Barkly landscape notice patch once

on:
  push:
    branches: [chatgpt/barkly-spacing-system-pass-20260830]
    paths:
      - '.github/workflows/barkly-landscape-notice-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-spacing-system-pass-20260830
          fetch-depth: 0

      - name: Move landscape notices out of the stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('barkly/app/src/ui/BarklyRoom.tsx')
          text = path.read_text()
          old = "landscape ? { left: navW + 12, right: interactionW + 12 } : { left: 22, right: 22 },"
          new = "landscape ? { left: screenW - interactionW + INTERACTION_GUTTER, right: INTERACTION_GUTTER } : { left: 22, right: 22 },"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one notice placement match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/src/ui/BarklyRoom.tsx
          git rm .github/workflows/barkly-landscape-notice-patch-once.yml
          git commit -m "Barkly: keep landscape notices off the stage"
          git push origin HEAD:chatgpt/barkly-spacing-system-pass-20260830
