name: Barkly NPC label spacing once

on:
  push:
    branches: [chatgpt/barkly-spacing-system-pass-20260830]
    paths:
      - '.github/workflows/barkly-npc-label-spacing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-spacing-system-pass-20260830
          fetch-depth: 0

      - name: Keep NPC labels clear on short portrait phones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('barkly/app/src/ui/BarklyRoom.tsx')
          text = path.read_text()

          changes = [
            (
              "  bond,\n}: {\n  id: NpcId;\n  onPress: () => void;\n  location: LocationId;",
              "  bond,\n  compactLabel = false,\n}: {\n  id: NpcId;\n  onPress: () => void;\n  location: LocationId;",
            ),
            (
              "  /** The live relationship, so the HISTORY is visible in how they stand. */\n  bond?: { kind: 'friend' | 'rival'; encounters: number };\n}) {",
              "  /** The live relationship, so the HISTORY is visible in how they stand. */\n  bond?: { kind: 'friend' | 'rival'; encounters: number };\n  /** Short portrait phones put the name above the dog so the care dock cannot cover it. */\n  compactLabel?: boolean;\n}) {",
            ),
            (
              "      <Text style={[styles.npcName, { bottom: -19 * scale }]}>{NPCS[id].name.toUpperCase()}</Text>",
              "      <Text\n        testID={`npc-name-${id}`}\n        style={[styles.npcName, { bottom: compactLabel ? spot.size * 1.25 * scale + 4 : -19 * scale }]}\n      >\n        {NPCS[id].name.toUpperCase()}\n      </Text>",
            ),
            (
              "              bond={bondFor(barkly.character, NPCS[id].name)}\n              onPress={() => barkly.npcTalk(id)}",
              "              bond={bondFor(barkly.character, NPCS[id].name)}\n              compactLabel={!landscape && screenH < 650}\n              onPress={() => barkly.npcTalk(id)}",
            ),
          ]

          for old, new in changes:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one match, found {count}: {old[:90]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/src/ui/BarklyRoom.tsx
          git rm .github/workflows/barkly-npc-label-spacing-once.yml
          git commit -m "Barkly: keep NPC labels clear of the care dock"
          git push origin HEAD:chatgpt/barkly-spacing-system-pass-20260830
