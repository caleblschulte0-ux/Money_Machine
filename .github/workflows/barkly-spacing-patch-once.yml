name: Barkly spacing patch once

on:
  push:
    branches: [chatgpt/barkly-spacing-system-pass-20260830]
    paths:
      - '.github/workflows/barkly-spacing-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-spacing-system-pass-20260830
          fetch-depth: 0

      - name: Apply BarklyRoom spacing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('barkly/app/src/ui/BarklyRoom.tsx')
          text = path.read_text()

          replacements = [
              (
                  "  chromeBottom,\n",
                  "  CARE_DOCK_CLEARANCE,\n  INTERACTION_GUTTER,\n  STATE_CHIP_GAP,\n  chromeBottom,\n",
              ),
              (
                  "stageArea: { flex: 1, alignItems: 'center', justifyContent: 'flex-end', paddingBottom: 48 },",
                  "stageArea: { flex: 1, alignItems: 'center', justifyContent: 'flex-end', paddingBottom: CARE_DOCK_CLEARANCE },",
              ),
              (
                  "chip: { position: 'absolute', bottom: 72,",
                  "chip: { position: 'absolute', bottom: CARE_DOCK_CLEARANCE + STATE_CHIP_GAP,",
              ),
              (
                  "interactionStack: { width: '100%', alignSelf: 'center', minHeight: TAP_MIN },",
                  "interactionStack: { width: '100%', alignSelf: 'center', minHeight: TAP_MIN, paddingHorizontal: INTERACTION_GUTTER },",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit the spacing pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/src/ui/BarklyRoom.tsx
          git rm .github/workflows/barkly-spacing-patch-once.yml
          git commit -m "Barkly: enforce stage clearance and shared gutters"
          git push origin HEAD:chatgpt/barkly-spacing-system-pass-20260830
