name: Barkly Home prop render

on:
  push:
    branches:
      - 'chatgpt/barkly-supercell-home-*'
      - 'claude/barkly-*'
      - 'claude/barkley-*'
    paths:
      - 'barkly/app/tools/blender/home_prop_pack.py'
      - 'barkly/app/tools/blender/home_architecture.py'
      - '.github/workflows/barkly-home-prop-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-home-props:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: barkly/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri xvfb imagemagick
          blender --version

      - name: Render modular Home prop pack
        run: xvfb-run -a blender -b --python tools/blender/home_prop_pack.py

      - name: Render modular Home architecture
        run: xvfb-run -a blender -b --python tools/blender/home_architecture.py

      - name: Trim transparent render canvases
        run: |
          for file in \
            art-review/home-props/chair.png \
            art-review/home-props/lamp.png \
            art-review/home-props/bed.png \
            art-review/home-props/shelf.png \
            art-review/home-architecture/window_frame.png; do
            convert "$file" -trim +repage "$file"
          done
          identify art-review/home-props/*.png art-review/home-architecture/window_frame.png

      - name: Confirm transparent outputs
        run: |
          test -s art-review/home-props/chair.png
          test -s art-review/home-props/lamp.png
          test -s art-review/home-props/bed.png
          test -s art-review/home-props/shelf.png
          test -s art-review/home-props/manifest.json
          test -s art-review/home-architecture/window_frame.png

      - name: Sync branch before promotion
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Promote rendered Home assets into app
        run: |
          mkdir -p assets/world/home/props assets/world/home/architecture
          cp art-review/home-props/chair.png assets/world/home/props/chair.png
          cp art-review/home-props/lamp.png assets/world/home/props/lamp.png
          cp art-review/home-props/bed.png assets/world/home/props/bed.png
          cp art-review/home-props/shelf.png assets/world/home/props/shelf.png
          cp art-review/home-props/manifest.json assets/world/home/props/manifest.json
          cp art-review/home-architecture/window_frame.png assets/world/home/architecture/window_frame.png

      - name: Commit generated Home assets to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/home/props assets/world/home/architecture
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged."
          else
            git commit -m "Barkly art: render production Home asset pack"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Home asset pack
        uses: actions/upload-artifact@v4
        with:
          name: barkly-home-assets-${{ github.sha }}
          path: |
            barkly/app/art-review/home-props/**
            barkly/app/art-review/home-architecture/**
          if-no-files-found: error
          retention-days: 14
