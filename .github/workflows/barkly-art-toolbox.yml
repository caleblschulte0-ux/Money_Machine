name: Barkly art toolbox

on:
  push:
    branches:
      - 'chatgpt/barkly-art-*'
    paths:
      - 'barkly/app/**'
      - '.github/workflows/barkly-art-toolbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: barkly/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: barkly/app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Install free image tooling
        run: python -m pip install 'Pillow>=10,<13'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck toolbox candidate
        run: npm run typecheck

      - name: Build isolated playtest artifact
        env:
          EXPO_PUBLIC_BARKLY_PLAYTEST: always
        run: node scripts/build-artifact.mjs --out art-toolbox.html

      - name: Audit production art assets
        run: npm run art:audit

      - name: Smoke-test asset intake
        run: python scripts/asset-intake.py assets/barkly/renders/front.png art-review/intake/front.png --trim --max-edge 1024 --report art-review/intake/front.json

      - name: Render multi-device art matrix
        run: npm run art:matrix

      - name: Compare approved Home target
        run: python scripts/reference-compare.py --actual art-review/home-390x844-iphone-portrait.png --reference art-reference/home-target.png --out art-review/reference/home-comparison.png

      - name: Render material lab
        run: npm run art:materials

      - name: Render animation juice lab
        run: npm run art:juice

      - name: Record motion review
        run: npm run art:motion

      - name: Upload art toolbox review
        uses: actions/upload-artifact@v4
        with:
          name: barkly-art-toolbox-${{ github.sha }}
          path: |
            barkly/app/art-review/**
          if-no-files-found: error
          retention-days: 14
