name: Barkly responsive stage once

on:
  push:
    branches: [chatgpt/barkly-layout-space-fix-20260830]
    paths:
      - '.github/workflows/barkly-layout-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-layout-space-fix-20260830

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: barkly/app/package-lock.json

      - name: Build responsive protected-stage layout
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {label}')
              return text.replace(old, new, 1)

          # Responsive geometry is centralized here. Extra screen reveals world;
          # it does not make Barkly or the HUD inflate without bound.
          Path('barkly/app/src/ui/layout.ts').write_text(r'''/**
           * Responsive screen geometry for Barkly.
           *
           * The world owns the viewport. Barkly and the core interaction chrome
           * live inside a protected stage whose size is bounded by device class.
           * More screen therefore reveals more scenery instead of scaling every
           * control and the dog until they look like a stretched website.
           */
          export const CONTENT_TOP = 12;
          export const CONTENT_BOTTOM = 12;

          export function contentTop(insetTop: number): number {
            return insetTop > 0 ? insetTop + 8 : CONTENT_TOP;
          }
          export function contentBottom(insetBottom: number): number {
            return insetBottom > 0 ? insetBottom + 8 : CONTENT_BOTTOM;
          }

          export const TAP_MIN = 44;
          export const STATUS_HEIGHT = TAP_MIN;
          export const PLACES_HEIGHT = TAP_MIN + 4;
          export const CHROME_BOTTOM = STATUS_HEIGHT + PLACES_HEIGHT + 6;

          export type LayoutMode = 'narrowPortrait' | 'widePortrait' | 'phoneLandscape' | 'tabletLandscape';

          export function layoutMode(width: number, height: number): LayoutMode {
            const landscape = width > height;
            const tablet = Math.min(width, height) >= 600;
            if (landscape) return tablet ? 'tabletLandscape' : 'phoneLandscape';
            return width >= 600 ? 'widePortrait' : 'narrowPortrait';
          }

          export function isLandscapeMode(mode: LayoutMode): boolean {
            return mode === 'phoneLandscape' || mode === 'tabletLandscape';
          }

          /** Portrait reserves two shallow top rows. Landscape moves navigation
           * into a side rail, so only the status row consumes vertical stage. */
          export function chromeBottom(mode: LayoutMode = 'narrowPortrait'): number {
            return isLandscapeMode(mode) ? STATUS_HEIGHT + 6 : CHROME_BOTTOM;
          }

          export function noticeTop(top: number, mode: LayoutMode = 'narrowPortrait'): number {
            return top + chromeBottom(mode) + 4;
          }
          export const NOTICE_MAX_HEIGHT = 38;

          export const DIALOGUE_HEIGHT = 96;
          export const DIALOGUE_GAP = 6;
          export const CONTROLS_HEIGHT = TAP_MIN + 14;
          export const SPEECH_MAX_LINES = 3;

          export function contentFrameWidth(width: number, mode: LayoutMode): number {
            if (mode === 'narrowPortrait') return width;
            if (mode === 'widePortrait') return Math.min(620, Math.max(560, width - 40));
            if (mode === 'phoneLandscape') return Math.max(560, width - 24);
            return Math.min(1120, Math.max(760, width - 48));
          }

          export function navRailWidth(mode: LayoutMode): number {
            return mode === 'tabletLandscape' ? 112 : mode === 'phoneLandscape' ? 92 : 0;
          }

          export function interactionRailWidth(mode: LayoutMode): number {
            return mode === 'tabletLandscape' ? 300 : mode === 'phoneLandscape' ? 250 : 0;
          }

          export function stageWidth(width: number, mode: LayoutMode): number {
            if (mode === 'narrowPortrait') return width;
            if (mode === 'widePortrait') return Math.min(560, width - 40);
            const gutters = mode === 'tabletLandscape' ? 64 : 52;
            const available = width - navRailWidth(mode) - interactionRailWidth(mode) - gutters;
            const cap = mode === 'tabletLandscape' ? 620 : 430;
            return Math.max(mode === 'tabletLandscape' ? 380 : 260, Math.min(cap, available));
          }

          export function stageHeight(screenHeight: number, mode: LayoutMode = 'narrowPortrait'): number {
            if (isLandscapeMode(mode)) {
              return Math.max(240, screenHeight - STATUS_HEIGHT - 18);
            }
            return Math.max(
              212,
              screenHeight - CHROME_BOTTOM - DIALOGUE_HEIGHT - DIALOGUE_GAP * 2 - CONTROLS_HEIGHT - 18,
            );
          }

          export const SPRITE_HEIGHT = 322;
          export const SPRITE_FOOT = 78;
          export const NOTICE_BAND = 4 + NOTICE_MAX_HEIGHT;
          const SPRITE_BODY_WIDTH = 244;

          export function spriteScale(
            screenHeight: number,
            stageWidthPx = 390,
            mode: LayoutMode = 'narrowPortrait',
          ): number {
            const landscape = isLandscapeMode(mode);
            const room = stageHeight(screenHeight, mode) - SPRITE_FOOT - (landscape ? 20 : NOTICE_BAND + 4);
            const byWidth = (stageWidthPx * 0.82) / SPRITE_BODY_WIDTH;
            const minScale = landscape
              ? screenHeight < 430 ? 0.62 : 0.72
              : screenHeight < 590 ? 0.60 : screenHeight < 680 ? 0.66 : 0.72;
            const cap = mode === 'tabletLandscape' ? 1.25 : mode === 'widePortrait' ? 1.34 : mode === 'phoneLandscape' ? 1.05 : 1.42;
            return Math.max(minScale, Math.min(cap, room / SPRITE_HEIGHT, byWidth));
          }

          export type NoticeKind = 'error' | 'degraded' | 'promotion' | 'reward';
          export const NOTICE_PRIORITY: NoticeKind[] = ['error', 'degraded', 'promotion', 'reward'];
          '''.replace('          ', ''))

          room_path = Path('barkly/app/src/ui/BarklyRoom.tsx')
          room = room_path.read_text()

          room = once(room, "import { asyncStorageStore } from '../storage/asyncStorageStore';\n", '', 'unused async store import')
          room = once(room, "import { activeSlot } from '../dev/saveSlots';\n", '', 'unused active slot import')

          room = once(
              room,
              '  CHROME_BOTTOM,\n  CONTROLS_HEIGHT,',
              '  CHROME_BOTTOM,\n  chromeBottom,\n  contentFrameWidth,\n  CONTROLS_HEIGHT,',
              'responsive imports 1',
          )
          room = once(
              room,
              '  contentBottom,\n  contentTop,\n  noticeTop,',
              '  contentBottom,\n  contentTop,\n  interactionRailWidth,\n  isLandscapeMode,\n  layoutMode,\n  navRailWidth,\n  noticeTop,',
              'responsive imports 2',
          )
          room = once(
              room,
              '  SPRITE_FOOT,\n  stageHeight,',
              '  SPRITE_FOOT,\n  stageHeight,\n  stageWidth,',
              'responsive imports 3',
          )

          room = once(
              room,
              "  const { height: screenH, width: screenW } = useWindowDimensions();\n",
              "  const { height: screenH, width: screenW } = useWindowDimensions();\n  const layout = layoutMode(screenW, screenH);\n  const landscape = isLandscapeMode(layout);\n  const widePortrait = layout === 'widePortrait';\n  const frameW = contentFrameWidth(screenW, layout);\n  const stageW = stageWidth(screenW, layout);\n  const navW = navRailWidth(layout);\n  const interactionW = interactionRailWidth(layout);\n  const chromeBottomPx = chromeBottom(layout);\n",
              'layout mode calculations',
          )
          room = once(room, '  const spriteScale = scaleForScreen(screenH, screenW);', '  const spriteScale = scaleForScreen(screenH, stageW, layout);', 'bounded Barkly scale')
          room = once(
              room,
              '  const sceneBand = screenH - DIALOGUE_HEIGHT - DIALOGUE_GAP * 2 - CONTROLS_HEIGHT + 8;',
              '  const sceneBand = landscape ? screenH : screenH - DIALOGUE_HEIGHT - DIALOGUE_GAP * 2 - CONTROLS_HEIGHT + 8;',
              'scene band',
          )
          room = once(
              room,
              '  const groundY = topPad + CHROME_BOTTOM + stageHeight(screenH) - SPRITE_FOOT;',
              '  const groundY = topPad + chromeBottomPx + stageHeight(screenH, layout) - SPRITE_FOOT;',
              'responsive ground line',
          )

          # Playtest is still fully reachable, but it no longer consumes a large
          # permanent chip beside the main location navigation.
          room = once(
              room,
              "  const [playtestOpen, setPlaytestOpen] = useState(false);\n  const [slotName, setSlotName] = useState<string | null>(null);\n  useEffect(() => {\n    if (!playtest) return;\n    void activeSlot(asyncStorageStore).then((s) => setSlotName(s?.name ?? null));\n  }, [playtest, playtestOpen]);",
              "  const [playtestOpen, setPlaytestOpen] = useState(false);",
              'playtest badge state',
          )

          room = once(
              room,
              "        {location === 'home' && <HomeScene hour={hour} upgrades={barkly.placedHome} asleep={asleep} groundY={groundY} chromeBottom={topPad + CHROME_BOTTOM} />}",
              "        {location === 'home' && <HomeScene hour={hour} upgrades={barkly.placedHome} asleep={asleep} groundY={groundY} chromeBottom={topPad + chromeBottomPx} />}",
              'home responsive chrome',
          )
          room = once(
              room,
              "        style={styles.chromeScrim}",
              "        style={[styles.chromeScrim, { height: chromeBottomPx + 78 }]}",
              'chrome scrim',
          )
          room = once(
              room,
              "        style={styles.horizon}",
              "        style={[styles.horizon, { height: landscape ? 76 : DIALOGUE_HEIGHT + CONTROLS_HEIGHT + 48 }]}",
              'bottom horizon',
          )
          room = once(
              room,
              "      <KeyboardAvoidingView style={styles.content} behavior={Platform.OS === 'ios' ? 'padding' : undefined}>",
              "      <KeyboardAvoidingView\n        style={[styles.content, { maxWidth: frameW, paddingHorizontal: landscape ? 12 : widePortrait ? 20 : 16 }]}\n        behavior={Platform.OS === 'ios' ? 'padding' : undefined}\n      >",
              'responsive content frame',
          )
          room = once(
              room,
              "          <View style={[styles.noticeLayer, { top: noticeTop(topPad) }]} pointerEvents=\"box-none\">",
              "          <View\n            style={[\n              styles.noticeLayer,\n              { top: noticeTop(topPad, layout) },\n              landscape ? { left: navW + 12, right: interactionW + 12 } : { left: 22, right: 22 },\n            ]}\n            pointerEvents=\"box-none\"\n          >",
              'notice safe zone',
          )

          places = room.index('        <View style={styles.places}>')
          start = room.index('          {playtest && (\n', places)
          marker = '          )}\n          <View style={styles.tabs}>'
          end = room.index(marker, start)
          room = room[:places] + room[places:].replace(
              '        <View style={styles.places}>',
              '        <View style={[styles.places, landscape && styles.placesLandscape, landscape && { width: navW }]}>',
              1,
          )
          # indexes changed after the replacement; find the playtest block again.
          places = room.index('        <View style={[styles.places')
          start = room.index('          {playtest && (\n', places)
          end = room.index(marker, start)
          room = room[:start] + '          <View style={[styles.tabs, landscape && styles.tabsLandscape]}>' + room[end + len(marker):]

          plan_old = '''          })}
          </View>
          {barkly.adventure && (
            <Pressable
              style={[styles.planChip, planComplete && styles.planChipDone]}
              onPress={() => openOnly(setPlanOpen)}
              accessibilityRole="button"
              accessibilityLabel={`Barkly's plan. ${planDone} of ${planTotal} complete. ${
                planComplete ? 'All done.' : barkly.adventure.goals.find((g) => !g.done)?.label ?? ''
              }`}
            >
              <Text style={[styles.planChipText, planComplete && styles.planChipTextDone]}>
                {planDone}/{planTotal}
              </Text>
            </Pressable>
          )}
        </View>'''
          plan_new = '''          })}
          {barkly.adventure && (
            <Pressable
              style={[styles.planChip, planComplete && styles.planChipDone, landscape && styles.planChipLandscape]}
              onPress={() => openOnly(setPlanOpen)}
              accessibilityRole="button"
              accessibilityLabel={`Barkly's plan. ${planDone} of ${planTotal} complete. ${
                planComplete ? 'All done.' : barkly.adventure.goals.find((g) => !g.done)?.label ?? ''
              }`}
            >
              <Text style={[styles.planChipText, planComplete && styles.planChipTextDone]}>
                {planDone}/{planTotal}
              </Text>
            </Pressable>
          )}
          </View>
        </View>'''
          room = once(room, plan_old, plan_new, 'attach plan counter to navigation')

          room = once(
              room,
              '        <View style={[styles.stageArea, { height: stageHeight(screenH) }]}>',
              '''        <View
          style={[
            styles.stageArea,
            { height: stageHeight(screenH, layout) },
            landscape
              ? { marginLeft: navW + 8, marginRight: interactionW + 8 }
              : { width: '100%', maxWidth: stageW, alignSelf: 'center' },
          ]}
        >''',
              'protected center stage',
          )

          room = once(
              room,
              '        <DialoguePanel\n',
              "        <View\n          style={[\n            styles.interactionStack,\n            landscape && styles.interactionStackLandscape,\n            landscape ? { width: interactionW } : { maxWidth: stageW },\n          ]}\n        >\n        <DialoguePanel\n",
              'interaction stack wrapper',
          )
          close_keyboard = '        </View>\n      </KeyboardAvoidingView>'
          idx = room.rfind(close_keyboard)
          if idx < 0:
              raise SystemExit('missing controls/keyboard close')
          room = room[:idx] + '        </View>\n        </View>\n      </KeyboardAvoidingView>' + room[idx + len(close_keyboard):]

          room = once(
              room,
              '        onForgetEverything={barkly.forgetEverything}\n      />',
              "        onForgetEverything={barkly.forgetEverything}\n        onOpenPlaytest={playtest ? () => { setSettingsOpen(false); setPlaytestOpen(true); } : undefined}\n      />",
              'playtest entry in settings',
          )

          style_changes = [
              ('  chromeScrim: { position: \'absolute\', left: 0, right: 0, top: 0, height: CHROME_BOTTOM + 92 },', "  chromeScrim: { position: 'absolute', left: 0, right: 0, top: 0 },", 'scrim base'),
              ("    height: DIALOGUE_HEIGHT + CONTROLS_HEIGHT + 56,", "    height: DIALOGUE_HEIGHT + CONTROLS_HEIGHT + 48,", 'horizon base'),
              ('  content: { flex: 1, paddingHorizontal: 22 },', "  content: { flex: 1, width: '100%', alignSelf: 'center', paddingHorizontal: 16 },", 'content frame style'),
              ("  headerButtons: { flexDirection: 'row', gap: 7 },", "  headerButtons: { flexDirection: 'row', gap: 6 },", 'header gap'),
              ('  walletTap: { flex: 1, marginHorizontal: 8 },', '  walletTap: { flex: 1 },', 'wallet margin'),
              ("  tabs: { flex: 1, flexDirection: 'row', marginTop: 10, backgroundColor: 'rgba(255,253,247,0.85)', borderRadius: 999, padding: 4, gap: 2, ...elevation.card },", "  tabs: { flex: 1, height: TAP_MIN, flexDirection: 'row', backgroundColor: 'rgba(255,253,247,0.90)', borderRadius: 999, padding: 3, gap: 2, ...elevation.card },", 'tab rail'),
              ("  stageArea: { flex: 1, alignItems: 'center', justifyContent: 'flex-end', paddingBottom: 22 },", "  stageArea: { flex: 1, alignItems: 'center', justifyContent: 'flex-end', paddingBottom: 12 },", 'stage padding'),
              ('  controls: { gap: 9 },', '  controls: { gap: 6 },', 'controls spacing'),
              ("  talk: { flex: 1, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 10, backgroundColor: color.pop, borderRadius: 999, paddingVertical: 18, overflow: 'hidden', ...elevation.card },", "  talk: { flex: 1, minHeight: TAP_MIN, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 9, backgroundColor: color.pop, borderRadius: 999, paddingVertical: 12, overflow: 'hidden', ...elevation.card },", 'talk height'),
          ]
          for old, new, label in style_changes:
              room = once(room, old, new, label)

          room = once(
              room,
              '''  playtest: {
    marginTop: 10,
    minHeight: TAP_MIN,
    justifyContent: 'center',
    paddingHorizontal: 10,
    borderRadius: 999,
    backgroundColor: color.ink,
  },
  playtestText: { fontSize: 10, fontWeight: '900', letterSpacing: 0.8, color: color.inkOn },
''',
              '',
              'remove dead playtest badge styles',
          )
          room = once(
              room,
              '''  places: {
    height: PLACES_HEIGHT,
    flexDirection: 'row',
    alignItems: 'center',
    gap: space.sm,
    marginTop: space.sm,
  },''',
              '''  places: {
    height: PLACES_HEIGHT,
    flexDirection: 'row',
    alignItems: 'center',
    gap: 6,
    marginTop: 4,
  },
  placesLandscape: {
    position: 'absolute',
    left: 0,
    top: STATUS_HEIGHT + 8,
    height: 'auto',
    marginTop: 0,
    zIndex: 30,
  },''',
              'places responsive styles',
          )
          room = once(
              room,
              '''  planChip: {
    minWidth: 46,
    height: TAP_MIN,
    paddingHorizontal: space.md,
    borderRadius: radius.pill,
    backgroundColor: color.card,
    alignItems: 'center',
    justifyContent: 'center',
    ...elevation.low,
  },''',
              '''  planChip: {
    minWidth: 42,
    height: TAP_MIN - 6,
    paddingHorizontal: 8,
    borderRadius: radius.pill,
    backgroundColor: color.goldWell,
    alignItems: 'center',
    justifyContent: 'center',
    ...elevation.flat,
  },
  planChipLandscape: { width: '100%', height: TAP_MIN, marginTop: 2 },''',
              'plan integrated style',
          )
          room = once(
              room,
              "  tab: { flexGrow: 1, flexShrink: 1, flexDirection: 'row', minHeight: TAP_MIN, paddingHorizontal: 6, borderRadius: 999, alignItems: 'center', justifyContent: 'center' },",
              "  tabsLandscape: { flex: 0, width: '100%', height: 'auto', flexDirection: 'column', padding: 4, gap: 4 },\n  tab: { flexGrow: 1, flexShrink: 1, flexDirection: 'row', minHeight: TAP_MIN, paddingHorizontal: 6, borderRadius: 999, alignItems: 'center', justifyContent: 'center' },",
              'vertical landscape tabs',
          )
          room = once(
              room,
              '''  noticeLayer: {
    position: 'absolute',
    left: 22,
    right: 22,
    height: NOTICE_MAX_HEIGHT,''',
              '''  noticeLayer: {
    position: 'absolute',
    height: NOTICE_MAX_HEIGHT,''',
              'notice dynamic sides',
          )
          room = once(
              room,
              '  controls: { gap: 6 },',
              "  interactionStack: { width: '100%', alignSelf: 'center' },\n  interactionStackLandscape: { position: 'absolute', right: 0, top: STATUS_HEIGHT + 8, bottom: 0, justifyContent: 'flex-end', paddingBottom: 2 },\n  controls: { gap: 6 },",
              'interaction side rail styles',
          )
          room_path.write_text(room)

          # Dialogue and action dock both become a little denser on portrait,
          # reclaiming stage height without violating 44px touch targets.
          dialogue_path = Path('barkly/app/src/ui/DialoguePanel.tsx')
          dialogue = dialogue_path.read_text()
          dialogue = once(dialogue, '    paddingVertical: space.md,', '    paddingVertical: space.sm,', 'dialogue vertical padding')
          dialogue_path.write_text(dialogue)

          kit_path = Path('barkly/app/src/ui/BarklyKit.tsx')
          kit = kit_path.read_text()
          for old, new, label in [
              ("  kit: { position: 'absolute', left: 7, right: 7, bottom: -1, height: 78,", "  kit: { position: 'absolute', left: 7, right: 7, bottom: -1, height: 72,", 'kit height'),
              ('bottom: -3, height: 25,', 'bottom: -3, height: 22,', 'dock shadow'),
              ('bottom: 2, height: 48,', 'bottom: 2, height: 44,', 'dock height'),
              ('minHeight: TAP_MIN + 20,', 'minHeight: TAP_MIN + 16,', 'slot height'),
              ('height: 68, zIndex: 2', 'height: 62, zIndex: 2', 'art height'),
          ]:
              kit = once(kit, old, new, label)
          kit_path.write_text(kit)

          settings_path = Path('barkly/app/src/ui/SettingsSheet.tsx')
          settings = settings_path.read_text()
          settings = once(
              settings,
              '  onForgetEverything: () => Promise<void>;\n}',
              '  onForgetEverything: () => Promise<void>;\n  onOpenPlaytest?: () => void;\n}',
              'settings playtest prop',
          )
          settings = once(
              settings,
              '    onGrantEverything,\n  } = props;',
              '    onGrantEverything,\n    onOpenPlaytest,\n  } = props;',
              'settings playtest destructure',
          )
          settings = once(
              settings,
              '          <ScrollView style={styles.scroll}>\n            <Text style={styles.section}>How Barkly is doing</Text>',
              '''          <ScrollView style={styles.scroll}>
            {onOpenPlaytest && (
              <Pressable
                style={styles.devRow}
                onPress={onOpenPlaytest}
                accessibilityRole="button"
                accessibilityLabel="Playtest saves"
                testID="playtest-settings"
              >
                <View style={styles.devRowText}>
                  <Text style={styles.devTitle}>Playtest saves</Text>
                  <Text style={styles.devBlurb}>Jump between testing states without using permanent game-screen space.</Text>
                </View>
                <Text style={styles.devState}>open</Text>
              </Pressable>
            )}
            <Text style={styles.section}>How Barkly is doing</Text>''',
              'playtest settings entry',
          )
          settings_path.write_text(settings)

          # The acceptance walk-through follows the same path a human tester now
          # does: Settings -> Playtest saves. Keep badge fallback for old builds.
          acceptance_path = Path('barkly/app/scripts/playtest-acceptance.mjs')
          acceptance = acceptance_path.read_text()
          acceptance = once(
              acceptance,
              '''async function loadPreset(id) {
  await dismissAnything();
  const badge = byId('playtest-badge');
  if (!(await badge.count())) {
    await page.screenshot({ path: `/tmp/acceptance-no-badge-${id}.png` });
    return false;
  }
  await badge.click();
  await settle(800);''',
              '''async function openPlaytestPanel() {
  const badge = byId('playtest-badge');
  if (await badge.count()) {
    await badge.click();
    await settle(800);
    return true;
  }
  const settings = page.getByRole('button', { name: 'Settings' }).first();
  if (!(await settings.count())) return false;
  await settings.click();
  await settle(600);
  const entry = page.getByRole('button', { name: 'Playtest saves' }).first();
  if (!(await entry.count())) return false;
  await entry.click();
  await settle(800);
  return true;
}

async function playtestEntryReachable() {
  const settings = page.getByRole('button', { name: 'Settings' }).first();
  if (!(await settings.count())) return false;
  await settings.click();
  await settle(500);
  const entry = page.getByRole('button', { name: 'Playtest saves' }).first();
  const ok = (await entry.count()) > 0;
  const close = page.getByRole('button', { name: 'Close settings' }).first();
  if (await close.count()) await close.click();
  await settle(500);
  return ok;
}

async function loadPreset(id) {
  await dismissAnything();
  if (!(await openPlaytestPanel())) {
    await page.screenshot({ path: `/tmp/acceptance-no-playtest-entry-${id}.png` });
    return false;
  }''',
              'acceptance playtest opening',
          )
          acceptance = once(
              acceptance,
              "check('24. playtest badge present on the playtest build', (await byId('playtest-badge').count()) > 0);",
              "check('24. playtest saves reachable from Settings', await playtestEntryReachable());",
              'acceptance playtest check',
          )
          acceptance_path.write_text(acceptance)

          overlap_path = Path('barkly/app/scripts/overlap-check.mjs')
          overlap = overlap_path.read_text()
          overlap = once(
              overlap,
              "  '360x568,360x600,360x640,375x667,390x720,390x844,412x915,430x932',",
              "  '360x568,360x640,390x844,430x932,667x375,844x390,768x1024,1024x768,820x1180,1180x820,1366x1024',",
              'responsive viewport matrix',
          )
          overlap = once(
              overlap,
              '  if (notice && size.height <= 720) {',
              '  if (notice && size.height <= 720 && size.height >= size.width) {',
              'portrait clear-line rule',
          )
          overlap_path.write_text(overlap)

          hero_path = Path('barkly/app/__tests__/hero_layout.test.ts')
          hero = hero_path.read_text()
          hero = once(
              hero,
              '  PLACES_HEIGHT,\n  STATUS_HEIGHT,',
              '  PLACES_HEIGHT,\n  STATUS_HEIGHT,\n  interactionRailWidth,\n  layoutMode,\n  navRailWidth,',
              'hero responsive imports 1',
          )
          hero = once(
              hero,
              '  spriteScale,\n  stageHeight,',
              '  spriteScale,\n  stageHeight,\n  stageWidth,',
              'hero responsive imports 2',
          )
          hero = hero.replace("\n});\n", r'''

  it('classifies the four layout modes explicitly', () => {
    expect(layoutMode(390, 844)).toBe('narrowPortrait');
    expect(layoutMode(768, 1024)).toBe('widePortrait');
    expect(layoutMode(844, 390)).toBe('phoneLandscape');
    expect(layoutMode(1024, 768)).toBe('tabletLandscape');
  });

  it('uses extra tablet width for world instead of inflating the dog', () => {
    const mode = layoutMode(1024, 768);
    const width = stageWidth(1024, mode);
    const scale = spriteScale(768, width, mode);
    expect(width).toBeLessThan(1024 * 0.7);
    expect(scale).toBeLessThanOrEqual(1.25);
  });

  it('reserves real side rails in landscape', () => {
    const mode = layoutMode(844, 390);
    expect(navRailWidth(mode)).toBeGreaterThanOrEqual(80);
    expect(interactionRailWidth(mode)).toBeGreaterThanOrEqual(220);
    expect(stageHeight(390, mode)).toBeGreaterThan(280);
  });
});
''', 1)
          hero_path.write_text(hero)

      - name: Install locked dependencies
        working-directory: barkly/app
        run: npm ci

      - name: Install Chromium
        working-directory: barkly/app
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: barkly/app
        run: npm run typecheck

      - name: App tests
        working-directory: barkly/app
        run: npm test -- --runInBand

      - name: Responsive layout and accessibility
        working-directory: barkly/app
        run: npm run check:ui

      - name: Playtest acceptance build
        working-directory: barkly/app
        run: |
          EXPO_PUBLIC_BARKLY_PLAYTEST=always node scripts/build-artifact.mjs --out responsive-playtest.html
          python3 -m http.server 8099 --directory . &
          for i in $(seq 1 20); do curl -sf http://localhost:8099/responsive-playtest.html >/dev/null && break; sleep 1; done
          node scripts/playtest-acceptance.mjs http://localhost:8099/responsive-playtest.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barkly-responsive-layout-${{ github.sha }}
          path: barkly/app/overlap-*.png
          if-no-files-found: ignore

      - name: Commit verified responsive stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/src/ui/BarklyRoom.tsx barkly/app/src/ui/layout.ts barkly/app/src/ui/DialoguePanel.tsx barkly/app/src/ui/BarklyKit.tsx barkly/app/src/ui/SettingsSheet.tsx barkly/app/scripts/playtest-acceptance.mjs barkly/app/scripts/overlap-check.mjs barkly/app/__tests__/hero_layout.test.ts
          git rm .github/workflows/barkly-layout-fix-once.yml
          git commit -m "Barkly: add responsive protected-stage layout"
          git push origin HEAD:chatgpt/barkly-layout-space-fix-20260830
