name: Barkly Blender lab

on:
  push:
    branches:
      - 'chatgpt/barkly-art-*'
    paths:
      - 'barkly/app/tools/blender/**'
      - '.github/workflows/barkly-blender-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-3d-material-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: barkly/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri xvfb
          blender --version

      - name: Render Barkly material scene
        run: xvfb-run -a blender -b --python tools/blender/material_scene.py

      - name: Upload Blender lab
        uses: actions/upload-artifact@v4
        with:
          name: barkly-blender-lab-${{ github.sha }}
          path: |
            barkly/app/art-review/blender/**
          if-no-files-found: error
          retention-days: 14
