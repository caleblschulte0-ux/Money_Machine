name: Barkly NPC label check once

on:
  push:
    branches: [chatgpt/barkly-spacing-system-pass-20260830]
    paths:
      - '.github/workflows/barkly-npc-label-check-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-spacing-system-pass-20260830
          fetch-depth: 0

      - name: Add NPC labels to measured collision boxes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('barkly/app/scripts/overlap-check.mjs')
          text = path.read_text()
          old = "  ['state-chip', 'text=/^listening$/'],\n  ['kit-feed', '[data-testid=\"kit-feed\"]'],"
          new = "  ['state-chip', 'text=/^listening$/'],\n  ['biscuit-label', '[data-testid=\"npc-name-biscuit\"]'],\n  ['duke-label', '[data-testid=\"npc-name-duke\"]'],\n  ['kit-feed', '[data-testid=\"kit-feed\"]'],"
          if text.count(old) != 1:
            raise SystemExit('NPC target insertion point changed')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/scripts/overlap-check.mjs
          git rm .github/workflows/barkly-npc-label-check-once.yml
          git commit -m "Barkly: measure NPC label collisions"
          git push origin HEAD:chatgpt/barkly-spacing-system-pass-20260830
