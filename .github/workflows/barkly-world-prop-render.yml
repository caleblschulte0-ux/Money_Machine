name: Barkly modular world prop render

on:
  push:
    branches:
      - 'chatgpt/barkly-world-2p5d-*'
      - 'chatgpt/barkly-supercell-home-*'
      # Claude's integration branch renders too; the pipeline was
      # unreachable from it, which is why the flat art kept shipping.
      # (Both Claude patterns were listed twice here -- harmless to Actions,
      # but a duplicated trigger list is the kind of thing that gets edited in
      # one copy and not the other.)
      - 'claude/barkly-*'
      - 'claude/barkley-*'
    paths:
      - 'barkly/app/tools/blender/world_prop_pack.py'
      - '.github/workflows/barkly-world-prop-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barkly-world-props-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-world-props:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: barkly/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri xvfb imagemagick
          blender --version

      - name: Render modular world prop pack
        run: xvfb-run -a blender -b --python tools/blender/world_prop_pack.py

      - name: Trim transparent render canvases
        run: |
          find art-review/world-props -name '*.png' -print0 | while IFS= read -r -d '' file; do
            convert "$file" -trim +repage "$file"
          done
          find art-review/world-props -name '*.png' -print0 | xargs -0 identify

      - name: Confirm modular transparent outputs
        run: |
          for file in \
            park/tree park/bench park/hedge park/dig_mound \
            town/store_coral town/store_aqua town/store_violet town/fountain town/lamp town/planter \
            beach/umbrella beach/lifeguard beach/dune beach/castle beach/palm beach/sand_mound \
            home/rug home/care_tray \
            item/treat_biscuit item/treat_cheese item/treat_steak \
            item/toy_ball item/toy_rope \
            item/collar_red item/collar_blue item/collar_green item/collar_gold \
            item/kit_bowl item/kit_stick; do
            test -s "art-review/world-props/${file}.png"
          done
          test -s art-review/world-props/manifest.json

      - name: Sync branch before promotion
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Promote rendered modules into app
        run: |
          mkdir -p assets/world/park/props assets/world/town/props assets/world/beach/props assets/world/home/props assets/world/item
          cp art-review/world-props/park/*.png assets/world/park/props/
          cp art-review/world-props/town/*.png assets/world/town/props/
          cp art-review/world-props/beach/*.png assets/world/beach/props/
          # Every home prop, not a hand-listed one. The tray shipped once as a
          # file this step did not name, so CI rendered it and promoted nothing --
          # the builder and the asset in the app would have drifted apart silently.
          cp art-review/world-props/home/*.png assets/world/home/props/
          # The shop's icons are seen at 30-48px and the care tray's at 74-86pt.
          # A 640px render of a biscuit is a quarter of a megabyte for something
          # the size of a fingernail, so they are promoted at 224px -- still
          # comfortably over 2x the largest place any of them is drawn, on a 3x
          # screen, and about a fifth of the bytes.
          for file in art-review/world-props/item/*.png; do
            convert "$file" -resize '224x224>' -strip "assets/world/item/$(basename "$file")"
          done
          cp art-review/world-props/manifest.json assets/world/manifest.json

      - name: Commit generated modules to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The whole promoted tree. This line used to name home/props/rug.png
          # by hand, two lines under a comment about exactly that mistake: the
          # copy step took every home prop and this step staged one of them, so
          # the care tray was rendered and promoted and then never committed.
          git add assets/world
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged."
          else
            git commit -m "Barkly art: render modular 2.5D world pack"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload world prop pack
        uses: actions/upload-artifact@v4
        with:
          name: barkly-world-props-${{ github.sha }}
          path: barkly/app/art-review/world-props/**
          if-no-files-found: error
          retention-days: 14
