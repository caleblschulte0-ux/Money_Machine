name: Barkly modular world prop render

on:
  push:
    branches:
      - 'chatgpt/barkly-world-2p5d-*'
      - 'chatgpt/barkly-supercell-home-*'
      # Claude's integration branch renders too; the pipeline was
      # unreachable from it, which is why the flat art kept shipping.
      # (Both Claude patterns were listed twice here -- harmless to Actions,
      # but a duplicated trigger list is the kind of thing that gets edited in
      # one copy and not the other.)
      - 'claude/barkly-*'
      - 'claude/barkley-*'
    paths:
      - 'barkly/app/tools/blender/world_prop_pack.py'
      - '.github/workflows/barkly-world-prop-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barkly-world-props-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-world-props:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: barkly/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri xvfb imagemagick python3-pil
          blender --version

      - name: Render modular world prop pack
        run: xvfb-run -a blender -b --python tools/blender/world_prop_pack.py

      # ONE PROMOTION RECIPE, AND IT LIVES IN THE REPO.
      #
      # These steps used to be a second implementation of "turn a render into
      # a shipped asset", written inline here: trim with `convert -trim`, copy
      # each folder, resize inventory art to 224px. `scripts/promote-props.py`
      # is the other one, and the moment the two disagreed this workflow won,
      # because it runs on every push that touches the pack and commits over
      # whatever is on the branch.
      #
      # It did exactly that on 2026-09-08: the script had started quantising
      # props to a 256-colour palette (undithered), this step had not, and CI
      # helpfully replaced the whole quantised world with unquantised renders
      # -- roughly three times the bytes -- in a commit that looked routine.
      # A duplicated recipe does not stay in sync; it just decides which copy
      # is authoritative by who writes last.
      #
      # So the workflow calls the script now. Anything about HOW an asset is
      # made -- trimming, icon sizing, palette depth, which scene plates ship
      # -- belongs there and is testable without a runner.
      # Still sync first: this job pushes to the branch, and a run that
      # started before another push would otherwise commit onto a stale tree.
      - name: Sync branch before promotion
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Promote rendered modules into the app
        run: python3 scripts/promote-props.py

      - name: Commit generated modules to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The whole promoted tree. This line used to name home/props/rug.png
          # by hand, two lines under a comment about exactly that mistake: the
          # copy step took every home prop and this step staged one of them, so
          # the care tray was rendered and promoted and then never committed.
          git add assets/world
          if git diff --cached --quiet; then
            echo "Rendered assets unchanged."
          else
            git commit -m "Barkly art: render modular 2.5D world pack"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload world prop pack
        uses: actions/upload-artifact@v4
        with:
          name: barkly-world-props-${{ github.sha }}
          path: barkly/app/art-review/world-props/**
          if-no-files-found: error
          retention-days: 14
