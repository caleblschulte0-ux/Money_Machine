name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install (core + dev, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Doctor (offline)
        run: python -m fishai doctor --offline --db runs/ci.db || true
      - name: Demo (motion detector, built-in tracker)
        run: python -m fishai demo --frames 120 --output runs/ci --db runs/ci.db --log-level WARNING
      - name: Upload demo outputs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: |
            runs/ci/demo_tank.summary.json
            runs/ci/demo_tank.annotated.mp4
          retention-days: 7

  ml-smoke:
    # Proves the real detector/tracker adapters import and run, with CPU torch.
    # Weights are downloaded here, never committed.
    name: ml smoke (ubuntu, cpu torch)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt -r requirements-dev.txt
          pip install -e .
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models/fishial_detector_v26
          key: fishial-detector-v26-${{ hashFiles('models/registry.json') }}
      - name: Download default weights
        run: python scripts/download_models.py
      - name: ML tests
        run: python -m pytest -q -m ml
      - name: Demo with YOLO + ByteTrack
        run: python -m fishai demo --frames 60 --detector yolo --tracker bytetrack --output runs/ml --db runs/ml.db --log-level WARNING
