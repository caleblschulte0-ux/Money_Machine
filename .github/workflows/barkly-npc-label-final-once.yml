name: Barkly NPC label final spacing once

on:
  push:
    branches: [chatgpt/barkly-spacing-system-pass-20260830]
    paths:
      - '.github/workflows/barkly-npc-label-final-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/barkly-spacing-system-pass-20260830
          fetch-depth: 0

      - name: Lift NPC nameplates out of the care-control lane
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('barkly/app/src/ui/BarklyRoom.tsx')
          text = path.read_text()
          old = "style={[styles.npcName, { bottom: compactLabel ? spot.size * 1.25 * scale + 4 : -19 * scale }]}"
          new = "style={[styles.npcName, { bottom: compactLabel ? spot.size * 1.25 * scale + 4 : -4 * scale }]}"
          if text.count(old) != 1:
            raise SystemExit('NPC label offset changed unexpectedly')
          text = text.replace(old, new, 1)
          old = "compactLabel={!landscape && screenH < 650}"
          new = "compactLabel={landscape || screenH < 650}"
          if text.count(old) != 1:
            raise SystemExit('NPC compact-label condition changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barkly/app/src/ui/BarklyRoom.tsx
          git rm .github/workflows/barkly-npc-label-final-once.yml
          git commit -m "Barkly: lift NPC nameplates out of controls"
          git push origin HEAD:chatgpt/barkly-spacing-system-pass-20260830
