name: Barkly CI

on:
  pull_request:
    paths:
      - 'barkly/**'
      - '.github/workflows/barkly-ci.yml'
  push:
    branches:
      - 'claude/**'
      - 'chatgpt/**'
    paths:
      - 'barkly/**'
      - '.github/workflows/barkly-ci.yml'

permissions:
  contents: read

concurrency:
  group: barkly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: barkly/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: barkly/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Do not auto-fix dependency trees in CI. Fail only on high/critical
      # production dependency findings; moderate transitive findings are still
      # visible in npm output and should be reviewed deliberately with Expo.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: App tests
        run: npm test -- --runInBand

      - name: Server tests
        run: npm run test:server
