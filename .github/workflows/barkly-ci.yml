name: Barkly CI

on:
  pull_request:
    paths:
      - 'barkly/**'
      - '.github/workflows/barkly-ci.yml'
  push:
    branches:
      - 'claude/**'
      - 'chatgpt/**'
    paths:
      - 'barkly/**'
      - '.github/workflows/barkly-ci.yml'

permissions:
  contents: read

concurrency:
  group: barkly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: barkly/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: barkly/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # THE CODE CHECKS RUN FIRST, and that ordering is the point.
      #
      # The audit used to sit here, and on 2026-09-04 npm's audit endpoint
      # returned 503 for seven minutes: the step failed, and typecheck and
      # BOTH test suites were skipped. A registry outage marked the commit red
      # without ever looking at the code, which is the wrong way round -- the
      # checks that can actually tell you something about this diff should not
      # be behind a third party's uptime.
      - name: Typecheck
        run: npm run typecheck

      - name: App tests
        run: npm test -- --runInBand

      - name: Server tests
        run: npm run test:server

      # Do not auto-fix dependency trees in CI. Fail only on high/critical
      # production dependency findings; moderate transitive findings are still
      # visible in npm output and should be reviewed deliberately with Expo.
      #
      # A REGISTRY OUTAGE IS NOT A VULNERABILITY. `npm audit` exits 1 both when
      # it finds something and when it cannot reach the endpoint at all, and
      # those two are not the same news. A real finding still fails the build,
      # loudly, with the advisory table. An unreachable registry is retried,
      # then reported as a warning that says plainly the tree was NOT audited
      # in this run -- because "we could not check" must never be printed as
      # "we checked and it is fine", and must not be printed as "you have a
      # vulnerability" either.
      - name: Production dependency audit
        timeout-minutes: 4
        run: |
          set -uo pipefail
          AUDIT='npm audit --omit=dev --audit-level=high --fetch-retries=2 --fetch-retry-maxtimeout=20000'
          for attempt in 1 2 3; do
            if $AUDIT >audit.out 2>audit.err; then
              cat audit.out
              echo "audit clean: no high or critical findings in production dependencies"
              exit 0
            fi
            if grep -qiE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up' audit.err; then
              echo "attempt $attempt: the npm registry did not answer"
              head -n 5 audit.err
              sleep $((attempt * 15))
              continue
            fi
            echo "high or critical findings in production dependencies:"
            cat audit.out
            cat audit.err
            exit 1
          done
          echo "::warning::npm audit could not reach the registry after 3 attempts. Production dependencies were NOT audited in this run."
          exit 0

  ui:
    name: Layout and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: barkly/app

    # A separate job on purpose. These two checks drive a real browser, so
    # they cost a Chromium download and a couple of minutes; keeping them out
    # of `validate` means typecheck and unit tests still report in under a
    # minute. They were previously run by hand, which for a check is the same
    # as not running: the 41 contrast failures and the 38px tap targets they
    # found had accumulated over every screen built so far.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: barkly/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Nothing may cover his face, and nothing may land on anything else,
      # with every popup on screen at once. See src/ui/layout.ts.
      - name: Layout contract
        run: npm run check:layout

      # ...and the SCENE may not cover his face either. The layout contract
      # only ever policed the UI, so the home room shipped a floor lamp whose
      # shade sat on his skull: it had been positioned entirely by reasoning
      # about the couch behind it, and the biggest thing on the screen was
      # never in that arithmetic.
      - name: Nothing stands on his face
        run: npm run build:pages && node scripts/prop-clear-check.mjs

      # Every control at least 44x44, every control labelled, every word
      # clearing WCAG AA against what is actually behind it.
      - name: Accessibility
        run: node scripts/a11y-check.mjs

      # The banked voice fails silently: the recordings are in the file, the
      # page looks fine, and he speaks in the browser's narrator because the
      # audio never became a data: URI. Every unit test mocks the player, so
      # only a real browser can tell.
      # OFFLINE and instant: does every fixed line he says have a recording,
      # and has any file started hiding new ones from the harvester? Three
      # separate lines went out in the browser's screen reader in one week
      # because this existed as a manual command nobody ran.
      - name: Every line he says is recorded
        run: npm run voice:check

      - name: His own voice
        run: node scripts/voice-check.mjs

      # Every tab agrees with the world, at every step of a full location
      # loop, both visually AND on the accessibility tree -- not just "did
      # the screen change when clicked". Needs the playtest bundle: Beach is
      # level-gated on a fresh save, so the default artifact never reaches it.
      - name: Navigation state
        run: node scripts/build-artifact.mjs --out dist/index.html
          && EXPO_PUBLIC_BARKLY_PLAYTEST=always node scripts/build-artifact.mjs --out dist/playtest/index.html
          && node scripts/nav-state-check.mjs --artifact dist/playtest/index.html

      - name: Upload measured screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshots
          path: barkly/app/overlap-*.png
          if-no-files-found: ignore
