[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishai"
version = "0.1.0"
description = "AI aquarium monitoring: watch fish, track them, measure behaviour, reason locally."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real detectors and trackers. Heavy: pulls in torch. Install with
#   pip install -e ".[ml]"
ml = [
    "ultralytics>=8.3",
    "supervision>=0.25,<0.31",
    "trackers>=0.1",
    "scipy>=1.11",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fishai = "fishai.cli:main"

[tool.setuptools.packages.find]
include = ["fishai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
